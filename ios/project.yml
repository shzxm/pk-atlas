name: PKAtlas
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  PKAtlas:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 药时
        CFBundleURLTypes:
          - CFBundleURLName: org.pkatlas.app.open
            CFBundleURLSchemes: [pkatlas]
        CFBundleName: PKAtlas
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsDocumentBrowser: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shzxm.PKAtlas
        PRODUCT_NAME: PKAtlas
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: YES
        ENABLE_APP_SANDBOX: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SDKROOT: iphoneos
    scheme:
      testTargets:
        - PKAtlasUITests
      gatherCoverageData: false

  PKAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PKAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shzxm.PKAtlasUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PKAtlas
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
