name: PKAtlas
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  PKAtlas:
    type: application
    platform: iOS
    sources:
      # Navigation remains native. A single bundled, offline-only SVG chart
      # component reproduces the website plot; it never opens a remote page.
      - path: Sources/PKAtlasApp.swift
      - path: Native
      - path: Resources/Assets.xcassets
      - path: Resources/Model/drug-catalog.json
        buildPhase: resources
      - path: Resources/Model/health-medication-aliases.json
        buildPhase: resources
      - path: Resources/Model/engine-compat.json
        buildPhase: resources
      - path: Resources/Model/engine-signing-public-key.txt
        buildPhase: resources
      - path: Resources/Model/site-engine.js
        buildPhase: resources
      - path: Resources/Chart/website-chart.html
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 药时
        CFBundleURLTypes:
          - CFBundleURLName: org.pkatlas.app.open
            CFBundleURLSchemes: [pkatlas]
        CFBundleName: PKAtlas
        CFBundleShortVersionString: "2.27"
        CFBundleVersion: "33"
        LSRequiresIPhoneOS: true
        UIApplicationSupportsDocumentBrowser: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.example.PKAtlas.refresh
        NSHealthShareUsageDescription: "经您授权后读取 Apple 健康已登记的药物，用于对照药时本机记录。"
        NSHealthUpdateUsageDescription: "药时不会向 Apple 健康写入用药事件；本功能仅申请读取权限。"
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities:
          - arm64
        UILaunchScreen:
          UIColorName: LaunchBackground
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PKAtlas
        CODE_SIGN_ENTITLEMENTS: 'Resources/PKAtlas-$(CONFIGURATION).entitlements'
        PRODUCT_NAME: PKAtlas
        INFOPLIST_FILE: Resources/Info.plist
        SWIFT_VERSION: "5.0"
        SWIFT_OBJC_BRIDGING_HEADER: Resources/PKAtlas-Bridging-Header.h
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: YES
        ENABLE_APP_SANDBOX: YES
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: YES
        MARKETING_VERSION: "2.27"
        CURRENT_PROJECT_VERSION: "33"
        SDKROOT: iphoneos
    scheme:
      testTargets:
        - PKAtlasUITests
        - PKAtlasNativeTests
      gatherCoverageData: false

  PKAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: PKAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PKAtlasUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PKAtlas
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO

  PKAtlasNativeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NativeTests
    dependencies:
      - target: PKAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.PKAtlasNativeTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
