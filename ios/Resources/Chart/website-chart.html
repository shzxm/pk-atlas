<meta name="color-scheme" content="light dark">

/* The verbose analytical notes are rendered as native text below the chart.
   Keep them in the DOM as a single computation source, but do not let them

</style></head><body>

function drawChart(data){

 text(svg,'血药 mg/L',L,14,CHART_COLORS.blood);text(svg,'等效 mg',W-R+7,14,equivalentAxis);

 const lastLabelX=[-Infinity,-Infinity,-Infinity];
 for(const dose of doseMarkers){
  const xx=x(dose.time),color=dose.preview?CHART_COLORS.previewBlood:dose.matched?'#77f0b6':CHART_COLORS.blood;
  line(svg,xx,T,xx,H-B,color,1,'3 6',dose.preview?.8:.58);
  const level=lastLabelX.findIndex(last=>xx-last>=(mobile?105:125)),slot=level<0?lastLabelX.indexOf(Math.min(...lastLabelX)):level;
  lastLabelX[slot]=xx;
  text(svg,`${dose.preview?'预计 ':dose.matched?'已匹配 ':''}${dateText(dose.time)} · ${fmt(dose.mg,3)} mg`,Math.min(W-R-5,Math.max(L+5,xx+4)),H-B+36+slot*15,color,mobile?9:10);
 }
 const pathFor=(points,getY)=>points.map((p,i)=>`${i?'L':'M'}${x(p.t).toFixed(2)} ${getY(p).toFixed(2)}`).join(' ');

 // markers. When the selected day has no records inside the marker window,
 // the previous guard hid a valid sampled curve entirely.
 {
  if(hasFoodEffect)svg.append(svgEl('path',{d:pathFor(points,p=>y(p.unfed)),fill:'none',stroke:CHART_COLORS.unfed,'stroke-width':2,'stroke-dasharray':'6 5','stroke-linejoin':'round'}));
  const path=pathFor(points,p=>y(p.c));
  svg.append(svgEl('path',{d:`${path} L${x(end)} ${y(0)} L${x(start)} ${y(0)} Z`,fill:'url(#curveFill)'}));
  svg.append(svgEl('path',{d:path,fill:'none',stroke:CHART_COLORS.blood,'stroke-width':3,'stroke-linejoin':'round','stroke-linecap':'round',pathLength:1000,class:'chart-line'}));
  svg.append(svgEl('path',{d:pathFor(points,p=>yEq(p.eq)),fill:'none',stroke:CHART_COLORS.equivalent,'stroke-width':2.5,'stroke-linejoin':'round','stroke-linecap':'round'}));
  if(hasFoodEffect&&data.foodEffectPoint){const p=data.foodEffectPoint,xx=x(p.t);line(svg,xx,y(p.c),xx,y(p.unfed),'#f6cd83',2.5);for(const v of [p.c,p.unfed])svg.append(svgEl('circle',{cx:xx,cy:y(v),r:4,fill:'#f6cd83',stroke:'#1b1c20','stroke-width':1.5}))}
  for(const record of records.filter(r=>r.time>=start&&r.time<=end))svg.append(svgEl('circle',{cx:x(record.time),cy:y(0),r:3.5,fill:CHART_COLORS.blood}));
  if(planned.length){
    svg.append(svgEl('path',{d:pathFor(points,p=>y(p.bloodPreview??p.c)),fill:'none',stroke:CHART_COLORS.previewBlood,'stroke-width':2.2,'stroke-dasharray':'5 5','stroke-linejoin':'round'}));
    if(data.previewFoodEffect){svg.append(svgEl('path',{d:pathFor(points,p=>y(p.noFoodPreview??p.unfed)),fill:'none',stroke:CHART_COLORS.unfed,'stroke-width':1.6,'stroke-dasharray':'2 5','stroke-linejoin':'round'}))}
    svg.append(svgEl('path',{d:pathFor(points,p=>yEq(p.eqPreview??p.eq)),fill:'none',stroke:CHART_COLORS.previewEquivalent,'stroke-width':2,'stroke-dasharray':'5 5','stroke-linejoin':'round'}));
  }
 }
 if(data.target?.time>=start&&data.target?.time<=end){
  const t=data.target,xx=x(t.time),eqMode=t.mode==='equivalent';
  const closest=points.reduce((best,p)=>Math.abs(p.t-t.time)<Math.abs(best.t-t.time)?p:best,points[0]);
  const level=eqMode?yEq(closest.eqPreview??closest.eq):y(closest.bloodPreview??closest.c);
  line(svg,xx,T,xx,H-B,CHART_COLORS.target,1,'3 5');
  svg.append(svgEl('circle',{cx:xx,cy:level,r:5,fill:CHART_COLORS.target,stroke:'#1b1c20','stroke-width':2}));
  text(svg,`${t.variant?'已采用 '+t.variant+' · ':''}目标 ${dateText(t.time)} · ${fmt(t.value,3)} ${eqMode?'mg（等效）':'mg/L'}`,xx+7,Math.max(T+12,level-9),CHART_COLORS.target,11);
 }
 // Same draggable dotted probe used on website; touch swipe is reserved for scrolling.
 const lineProbe=line(svg,L,T,L,H-B,lightTheme()?'#51637a':'#e4e6e9',1.2,'3 4');
 const dot=svgEl('circle',{cx:L,cy:y(0),r:5,fill:'#f9e0c5',stroke:'#1b1c20','stroke-width':2});svg.append(dot);
 const probeAxis=text(svg,'',L,H-4,lightTheme()?'#27384a':'#fff',11,'middle','700');
 view={points,x,y,lineProbe,dot,probeAxis,start,end,W,L,R,count,drug:data.drugId,scale,scrollTo:data.scrollTo};
 const slider=el('timeScrubber');slider.max=String(count);slider.value=String(clamp(Math.round(((data.probeTime||Date.now())-start)/(end-start)*count),0,count));
 updateProbe(Number(slider.value));
 const keepPosition=previous&&previous.start===start&&previous.end===end&&previous.drug===data.drugId&&previous.scale===scale&&previous.scrollTo===data.scrollTo;
 const center=keepPosition?previous.start+(previousScroll+previousViewport/2-previous.L)/(previous.W-previous.L-previous.R)*(previous.end-previous.start):clamp(data.scrollTo||Date.now(),start,end);
 wrap.scrollLeft=Math.max(0,x(center)-wrap.clientWidth/2);
 const move=e=>{const rect=svg.getBoundingClientRect(),px=(e.clientX-rect.left)/rect.width*W;updateProbe(Math.round((px-L)/(W-L-R)*count))};
 svg.onpointerdown=e=>{if(e.pointerType!=='touch')svg.setPointerCapture(e.pointerId);if(e.pointerType!=='touch')move(e)};
 svg.onpointermove=e=>{if(e.buttons&&e.pointerType!=='touch')move(e)};
 el('stats').replaceChildren();
 const stats=[['峰值血药',records.length?fmt(peak.c,peak.c<1?3:2)+' mg/L':'—'],['窗口等效峰值',records.length?fmt(Math.max(...points.map(p=>p.eq)),1)+' mg（等效）':'—']];
 for(const pair of stats){const block=document.createElement('span');block.textContent=pair[0]+' · ';const strong=document.createElement('strong');strong.textContent=pair[1];block.append(strong);el('stats').append(block)}
 const legend=el('legend');legend.replaceChildren();
 const addLegend=(value,color,style='solid')=>{const sp=document.createElement('span');sp.className='item';const i=document.createElement('i');i.style.setProperty('--c',color);if(style!=='solid')i.className=style;sp.append(i,document.createTextNode(' '+value));legend.append(sp)};
 addLegend(hasFoodEffect?'已计饮食血药浓度 · 左轴 mg/L':'已记血药浓度 · 左轴 mg/L',CHART_COLORS.blood);
 addLegend('剂量等效量 · 右轴 mg',CHART_COLORS.equivalent);
 if(hasFoodEffect)addLegend('未计饮食参考',CHART_COLORS.unfed,'dash');
 if(refBlood)addLegend('血药参考线 · 左轴 mg/L',CHART_COLORS.reference,'dash');
 if(refEq)addLegend('等效参考线 · 右轴 mg',CHART_COLORS.referenceEquivalent,'dash');
 if(planned.length){addLegend('蓝色虚线＝假设后的血药浓度 · 左轴',CHART_COLORS.previewBlood,'dash');if(data.previewFoodEffect)addLegend('浅灰点线＝假设节点不计饮食 · 左轴',CHART_COLORS.unfed,'dot');addLegend('紫色虚线＝假设后的剂量等效量 · 右轴',CHART_COLORS.previewEquivalent,'dash')}

 // Same descending-crossing explanation as the website's renderCrossing,

  if(level===null){crosses.push(peakText+'输入参考值后显示下降交点。');continue}

 const foodName=data.foodType||'';
 el('chartCaption').textContent=records.length?`仅统计${data.drugName||data.drugId} · 历史共 ${records.length} 次记录，同药物跨日残留已计入${data.adoptedVariant?' · 已采用方案 '+data.adoptedVariant+' 的剩余节点显示为虚线':''}${foodName?' · 餐型：'+foodName:''}${hasFoodEffect?' · 已计饮食峰值约 '+fmt(peak.c,3)+' mg/L；未计饮食参考峰值约 '+fmt(unfedPeak.unfed,3)+' mg/L':''} · 当前窗口 ${dateText(start)}—${dateText(end)}`:planned.length?`${data.drugName||data.drugId}暂无已记服用；蓝色虚线为假设血药浓度，紫色虚线为假设剂量等效量 · 当前窗口 ${dateText(start)}—${dateText(end)}`:`${data.drugName||data.drugId}暂无单次记录`;

function updateProbe(index,auto=false){

               ['剂量等效量',fmt(p.eq,1)+' mg（等效）',CHART_COLORS.equivalent]];
 if(hasFoodEffect)values.push(['未计饮食参考',fmt(p.unfed,p.unfed<1?3:2)+' mg/L',CHART_COLORS.unfed]);
 if(hasPreview){values.push(['假设后血药浓度',fmt(p.bloodPreview,p.bloodPreview<1?3:2)+' mg/L',CHART_COLORS.previewBlood]);values.push(['假设后剂量等效量',fmt(p.eqPreview,1)+' mg（等效）',CHART_COLORS.previewEquivalent]);if(data.previewFoodEffect)values.push(['假设节点不计饮食',fmt(p.noFoodPreview,p.noFoodPreview<1?3:2)+' mg/L',CHART_COLORS.unfed])}
 if(Number(data.referenceBlood)>0)values.push(['血药参考线',fmt(data.referenceBlood,3)+' mg/L',CHART_COLORS.reference]);
 if(Number(data.referenceEquivalent)>0)values.push(['等效参考线',fmt(data.referenceEquivalent,3)+' mg',CHART_COLORS.referenceEquivalent]);
 if(data.target){const target=points.reduce((best,point)=>Math.abs(point.t-data.target.time)<Math.abs(best.t-data.target.time)?point:best,points[0]);const value=data.target.mode==='equivalent'?(target.eqPreview??target.eq):(target.bloodPreview??target.c);values.push([`目标时刻 ${dateText(data.target.time)}`,fmt(value,3)+(data.target.mode==='equivalent'?' mg（等效）':' mg/L'),CHART_COLORS.target])}
 const out=el('probeValues');out.replaceChildren();
 for(const [label,value,color] of values){const box=document.createElement('span');box.textContent=label+'：';const strong=document.createElement('b');strong.style.color=color;strong.textContent=value;box.append(strong);out.append(box)}
 if(!auto){probeManual=true;clearTimeout(probeResetTimer);probeResetTimer=setTimeout(showNowProbe,5000)}
 el('probeReadout').textContent=`${auto?'现在':'选中'} ${formatTime(p.t)}`;
}
function showNowProbe(){
 if(!view)return;
 probeManual=false;
 const {points,x,y,lineProbe,dot,probeAxis,start,end,count}=view,now=Date.now(),inside=now>=start&&now<=end;
 const i=clamp(Math.round((now-start)/(end-start)*count),0,count);
 updateProbe(i,true);
 lineProbe.setAttribute('visibility',inside?'visible':'hidden');
 dot.setAttribute('visibility',inside?'visible':'hidden');
 probeAxis.setAttribute('visibility',inside?'visible':'hidden');
 if(!inside)el('probeReadout').textContent='图示窗口外 · 当前 '+dateText(now);
}
el('timeScrubber').addEventListener('input',e=>updateProbe(Number(e.target.value)));
el('chartWrap').addEventListener('scroll',()=>{
 if(chartScrollFrame||!view)return;
 chartScrollFrame=requestAnimationFrame(()=>{
  chartScrollFrame=0;if(!view)return;
  const wrap=el('chartWrap'),t=view.start+(wrap.scrollLeft+wrap.clientWidth/2-view.L)/(view.W-view.L-view.R)*(view.end-view.start);
  updateProbe(Math.round((t-view.start)/(view.end-view.start)*view.count));
 });
},{passive:true});
new ResizeObserver(()=>{if(pending)drawChart(pending)}).observe(el('chartWrap'));
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(pending)drawChart(pending)});
window.PKAtlasChart={inspect(){return {sampleCount:pending?.points?.length||0,paths:el('chart').querySelectorAll('path').length,viewport:el('chartWrap').clientWidth,contentWidth:el('chartWrap').scrollWidth}},height(){const last=el('legend');return Math.ceil(last.getBoundingClientRect().bottom-document.body.getBoundingClientRect().top+20)},summary(){return {stats:Array.from(el('stats').children).map(item=>item.textContent).join('  ·  '),crossing:el('crossingResult').textContent||'',caption:el('chartCaption').textContent||'',meals:el('mealStatus').textContent||''}},render:websiteRender,center(at){if(!view)return;el('chartWrap').scrollLeft=Math.max(0,view.x(at)-el('chartWrap').clientWidth/2);updateProbe(Math.round((at-view.start)/(view.end-view.start)*view.count))},reset(){if(pending)drawChart(pending)}};
</script></body></html>
